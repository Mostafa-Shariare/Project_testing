services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET:-dev-docker-secret-change-me}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: attention_tracker
      CORS_ORIGINS: http://localhost:8000,http://localhost:5173
    depends_on:
      - mongo

volumes:
  mongo_data:
